name: Sync Refilly app icons

on:
  push:
    branches: [main]
    paths:
      - "assets/brand/refilly_app_icon.png"
      - "tools/generate_brand_icons.py"
      - ".github/workflows/sync-brand-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install icon renderer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Render all launcher icons
        run: python tools/generate_brand_icons.py
      - name: Save refreshed Android, iOS and web icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/mipmap-*/ic_launcher.png
          git add ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
          git add web/favicon.png web/icons/*.png
          if ! git diff --cached --quiet; then
            git commit -m "build(brand): sync Refilly launcher icons"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
