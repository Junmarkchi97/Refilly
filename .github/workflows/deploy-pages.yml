name: Deploy Flutter web to GitHub Pages

# Every commit to main is built and deployed. Manual runs can redeploy the latest.
# Uses Refilly's browser-safe Supabase publishable key by default. GitHub
# variable/secret overrides remain supported for future key rotations.
# NEVER put a service-role or sb_secret_* key in this public web build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# The site's publishing source is gh-pages (/), not GitHub Actions.
# Do not publish an older commit after a newer one has been queued.
concurrency:
  group: refilly-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate production Supabase configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://eregmlruwyzrziihihbt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_SzEekFNizxv3mJIgQnjeNw_-i8nIYCH' }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Supabase configuration is missing; provide an enabled publishable key and project URL."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://*.supabase.co* ]]; then
            echo "::error::SUPABASE_URL must be a valid HTTPS Supabase project URL."
            exit 1
          fi

      - name: Build production web
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://eregmlruwyzrziihihbt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_SzEekFNizxv3mJIgQnjeNw_-i8nIYCH' }}
          APP_URL: https://junmarkchi97.github.io/Refilly
        shell: bash
        run: |
          # Publishable keys are safe for a browser app; NEVER use a service-role key.
          # Dart defines are written to a temp file rather than passed on the command line.
          python3 - <<'PY'
          import json, os
          with open('/tmp/refilly-web-defines.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'SUPABASE_URL': os.environ['SUPABASE_URL'],
                  'SUPABASE_ANON_KEY': os.environ['SUPABASE_ANON_KEY'],
                  'APP_URL': os.environ['APP_URL'],
              }, f)
          PY
          flutter build web --release --base-href /Refilly/ --pwa-strategy=none --dart-define-from-file=/tmp/refilly-web-defines.json
          rm -f /tmp/refilly-web-defines.json
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/main.dart.js

      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          force_orphan: true
          enable_jekyll: false
          full_commit_message: 'deploy(web): publish ${{ github.sha }}'

      # GitHub deliberately does not trigger Pages branch builds when the
      # branch push was made using GITHUB_TOKEN. Request it explicitly.
      # This is the Pages REST API: POST /repos/{owner}/{repo}/pages/builds.
      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          response=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --request POST \
            --write-out '\n%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          status="$(printf '%s\n' "$response" | tail -n 1)"
          payload="$(printf '%s\n' "$response" | sed '$d')"
          if [[ "$status" != "201" && "$status" != "202" ]]; then
            echo "::error::GitHub Pages rebuild request failed (HTTP $status)."
            echo "$payload" | head -c 1000
            exit 1
          fi
          echo "GitHub Pages build accepted (HTTP $status)."
